[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-structure-cloner"
version = "0.1.0"
description = "Read-only Telegram structure blueprint exporter built on Telethon."
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.36,<2",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
