[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemorph"
version = "0.1.0"
description = "Telegram structure blueprint exporter and clone planner built on Telethon."
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.36,<2",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<14",
]

[project.scripts]
telemorph = "telegram_structure_cloner.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_structure_cloner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
